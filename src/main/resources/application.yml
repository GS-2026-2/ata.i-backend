# Configuração comum a todos os perfis.
# Credenciais NUNCA são definidas aqui: vêm de variáveis de ambiente
# (ou do arquivo .env local, importado de forma opcional abaixo).

spring:
  application:
    name: atai-backend

  # Lê o .env da raiz do projeto quando existir (execução local via Maven/IDE).
  # Variáveis de ambiente reais têm precedência sobre o arquivo.
  # Em Docker/Render o arquivo não existe e é ignorado.
  config:
    import: optional:file:.env[.properties]

  # Perfil ativo vem de SPRING_PROFILES_ACTIVE (ambiente ou .env).
  # Se não for informado, o perfil "local" é usado.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
    default: local

  # Oracle Database (FIAP). Sem valores padrão: a ausência das variáveis
  # gera erro explícito na inicialização, sem fallback para outro banco.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: atai-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      # Nenhuma alteração automática de esquema.
      # Mudar para "validate" quando as entidades e tabelas existirem.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Migrations desabilitadas até validar versão e permissões do Oracle FIAP.
  flyway:
    enabled: false
    locations: classpath:db/migration

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
